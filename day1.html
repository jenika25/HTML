<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records</title>

    <style>
        body
        {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }

        table
        {
            width: 70%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td
        {
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }
        th
        {
            background-color: #4CAF50;
            color: white;
        }

        tr:nth-child(even){
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h2>Student Records</h2>

    <table id="studentTable">
        <thead>
            <tr>
                <th>id</th>
                <th>Name</th>
                <th>Username</th>
                <th>Email</th>
                <th style="padding: 90px;"> address</th>
                <th>phone</th>
                <th>website</th>
                <th>company</th>
            </tr>
        </thead>

        <tbody>

        </tbody>
    </table>

<script>

async function loadStudents()
{

    const response = await fetch("https://jsonplaceholder.typicode.com/users");

    const students = await response.json();

    const tbody = document.querySelector("#studentTable tbody");

    students.forEach(student => {

        tbody.innerHTML += `
            <tr>
                <td>${student.id}</td>
                <td>${student.name}</td>
                <td>${student.username}</td>
                <td>${student.email}</td>
                <td>${student.address.street + " , " + student.address.suite + " , " + student.address.city 
                    + " , " + student.address.zipcode}</td>
                <td>${student.phone}</td>
                <td>${student.website}</td>
                <td>${student.company.name + " , " + student.company.catchPhrase + " , " + student.company.bs}</td>
            </tr>
        `;
    });
}

loadStudents();

</script>

</body>
</html>
